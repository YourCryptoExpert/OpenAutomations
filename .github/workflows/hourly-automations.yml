name: hourly-automations

on:
  schedule:
    - cron: "5 * * * *"  # every hour at :05 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run hourly automations
        run: python scripts/run_all.py
      - name: Commit data
        run: |
          git config user.name "hourly-bot"
          git config user.email "hourly-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "hourly data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
